name: MyJobMag Scraper

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: {}       # allows manual "Run workflow" trigger too

# Needed so the job can commit processed.csv back to the repo
permissions:
  contents: write

concurrency:
  group: myjobmag-scraper
  cancel-in-progress: false   # never kill a run mid-scrape; queue instead

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python myjobmag_scraper.py

      # Persist processed.csv so the NEXT scheduled run knows what's already
      # been posted and picks up where this run left off — no duplicates.
      - name: Commit processed.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.csv
          if git diff --cached --quiet; then
            echo "No changes to processed.csv — nothing to commit."
          else
            git commit -m "chore: update processed.csv [skip ci]"
            git push
          fi
