name: MyJobMag Scraper

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes — each run only does a small
                              # page chunk now, so it needs to run more often
                              # to work through the backlog in reasonable time
  workflow_dispatch: {}       # allows manual "Run workflow" trigger too

# Needed so the job can commit processed.csv / current_page.txt back to the repo
permissions:
  contents: write

concurrency:
  group: myjobmag-scraper
  cancel-in-progress: false   # never kill a run mid-scrape; queue instead

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # a chunked run (PAGES_PER_RUN pages) should
                               # comfortably finish well inside this; raise
                               # PAGES_PER_RUN and this together if you want
                               # bigger chunks per run

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PAGES_PER_RUN: "15"   # pages walked per invocation; tune to taste
        run: python myjobmag_scraper.py

      # Persist processed.csv AND current_page.txt so the NEXT scheduled run
      # knows what's already been posted, and which page to resume from —
      # no duplicates, and no starting over from page 10800 every time.
      - name: Commit progress files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.csv current_page.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update scraper progress [skip ci]"
            git push
          fi
